plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
}

def grpcVersion = '1.85.1'        // same gRPC as the Java scheduler
def protobufVersion = '4.36.2'    // same protobuf as the Java scheduler (lite runtime on Android)

android {
    namespace 'com.soufiane.ar.glasses'
    compileSdk 34

    defaultConfig {
        applicationId 'com.soufiane.ar.glasses'
        // Low on purpose: the Android version under the glasses' WEBB OS is unknown, the app must
        // install there (Android 8.0 = API 26).
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // The shared contract lives outside the project: AR/proto/ar/v1/detection.proto
    sourceSets {
        main {
            proto {
                srcDir '../../proto'
            }
        }
    }
    // Unit tests (app/src/test) run on the PC's JVM: android.util.Log etc. return defaults there.
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
            }
        }
    }
}

dependencies {
    implementation "io.grpc:grpc-okhttp:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf-lite:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-javalite:${protobufVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'   // @Generated in gRPC's generated code

    testImplementation 'junit:junit:4.13.2'
}
