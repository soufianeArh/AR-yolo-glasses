syntax = "proto3";

package ar.v1;

option java_multiple_files = true;
option java_package = "com.soufiane.ar.proto.v1";
option java_outer_classname = "DetectionProto";

message Frame {
  string session_id     = 1;
  uint64 frame_id       = 2;
  int64  captured_at_ms = 3;
  bytes  jpeg           = 4;
  repeated string models = 5;
}

// boxes are normalized 0..1 so they dont depend on the image size
message Detection {
  string label      = 1;
  float  confidence = 2;
  float  x1 = 3;
  float  y1 = 4;
  float  x2 = 5;
  float  y2 = 6;
  string model      = 7;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  OK                = 1;
  DROPPED_DEADLINE  = 2;
  WORKER_FAILED     = 3;
  NO_WORKER         = 4;
  BAD_FRAME         = 5;
  SESSION_LIMIT     = 6;
}

// results can come back in any order so the client matches them by frame_id
message FrameResult {
  string session_id = 1;
  uint64 frame_id   = 2;
  ResultStatus status = 3;
  repeated Detection detections = 4;
  string worker_id  = 5;
  uint32 infer_ms   = 6;
  uint32 backend_ms = 7;
  string error      = 8;
}

message WorkerHeartbeat {
  string worker_id    = 1;
  string address      = 2;
  repeated string models = 3;
  bool   busy         = 4;
  uint32 queue_depth  = 5;
  float  avg_infer_ms = 6;
  uint32 threads      = 7;
}

message HeartbeatAck {
  bool accepted = 1;
}

service FrameStream {
  rpc Stream (stream Frame) returns (stream FrameResult);
}

service InferenceWorker {
  rpc Detect (Frame) returns (FrameResult);
}

service WorkerControl {
  rpc Heartbeat (WorkerHeartbeat) returns (HeartbeatAck);
}
